<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ÆNAO Controller</title>
    <style>
      @font-face {
        font-family: "Razor Keen";
        src: url("fonts/razor-keen.regular.otf") format("opentype");
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --bg: #000;
        --panel: #000;
        --line: rgba(255, 255, 255, 0.72);
        --text: #fff;
        --muted: #fff;
        --gold: #fff;
        --red: #fff;
        --cyan: #fff;
        font-family: "Razor Keen", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 16px;
        background: #000;
        color: var(--text);
      }

      button,
      input,
      select {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #000;
        color: var(--text);
        font: inherit;
      }

      button {
        background: #000;
        color: #fff;
        font-weight: 900;
      }

      button.secondary {
        background: #000;
        color: var(--text);
      }

      .phone-shell {
        display: grid;
        gap: 14px;
        max-width: 520px;
        margin: 0 auto;
      }

      .panel {
        display: grid;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #000;
        box-shadow: none;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 26px;
      }

      h2 {
        font-size: 18px;
      }

      .muted {
        color: var(--muted);
      }

      .stat-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .stat {
        position: relative;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #000;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .stat strong {
        font-size: 22px;
      }

      .phone-damage-badge {
        position: absolute;
        top: -8px;
        right: 8px;
        min-width: 36px;
        padding: 3px 7px;
        border: 1px solid #fff;
        border-radius: 999px;
        background: #000;
        color: #fff;
        font-size: 12px;
        font-weight: 900;
        text-align: center;
      }

      .choice {
        display: grid;
        gap: 8px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 7px;
        background: #000;
      }

      .choice.selected-choice {
        border-color: #fff;
      }

      .active-cast {
        color: var(--gold);
        font-weight: 900;
      }

      .choice.active-cast {
        border-color: #fff;
        background: #090909;
        box-shadow:
          0 0 0 1px #fff,
          0 0 18px rgba(255, 255, 255, 0.22);
      }

      .results {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 14px;
      }

      .warning {
        color: var(--red);
        font-weight: 900;
      }

      .cast {
        color: var(--cyan);
        font-weight: 900;
      }

      body,
      body * {
        color: #fff !important;
        font-family: "Razor Keen", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
        letter-spacing: 0 !important;
      }

      ::placeholder {
        color: #fff !important;
        opacity: 1;
      }

      body {
        font-size: 18px;
      }

      button,
      input,
      select {
        font-size: 18px;
      }

      h1 {
        font-size: 32px;
      }

      h2 {
        font-size: 23px;
      }

      .muted,
      .results {
        font-size: 16px;
        line-height: 1.35;
      }

      .stat span {
        font-size: 14px;
      }

      .stat strong {
        font-size: 26px;
      }

      .phone-damage-badge {
        border-color: #ef6f61 !important;
        box-shadow: 0 0 14px rgba(239, 111, 97, 0.3);
      }

      .choice.selected-choice,
      .choice.active-cast {
        border-color: #e1b84c !important;
        box-shadow: 0 0 16px rgba(225, 184, 76, 0.3);
      }

      .active-cast,
      .cast {
        text-shadow: 0 0 10px rgba(225, 184, 76, 0.35);
      }

      .warning {
        text-shadow: 0 0 10px rgba(239, 111, 97, 0.35);
      }

      .phone-damage-badge,
      .choice.selected-choice,
      .choice.active-cast {
        box-shadow: none !important;
      }

      .active-cast,
      .cast,
      .warning {
        text-shadow: none !important;
      }
    </style>
  </head>
  <body>
    <main id="controller" class="phone-shell"></main>
    <script src="controller.js"></script>
  </body>
</html>
