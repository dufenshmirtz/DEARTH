<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEARTH Controller</title>
    <style>
      @font-face {
        font-family: "Razor Keen";
        src: url("fonts/razor-keen.regular.otf") format("opentype");
        font-display: swap;
      }
      /* Greek and Chinese letters (scripts/subset-fonts.py), as in styles.css */
      @font-face {
        font-family: "Razor Keen";
        src: url("fonts/i18n/mansalva-greek.woff2") format("woff2");
        unicode-range: U+0370-03FF, U+1F00-1FFF;
        size-adjust: 88%;
        font-display: swap;
      }
      @font-face {
        font-family: "Razor Keen";
        src: url("fonts/i18n/longcang-zh.woff2") format("woff2");
        unicode-range: U+3000-303F, U+4E00-9FFF, U+FF00-FFEF;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --bg: #000;
        --panel: #000;
        --line: rgba(255, 255, 255, 0.72);
        --text: #fff;
        --muted: #fff;
        --gold: #fff;
        --red: #fff;
        --cyan: #fff;
        font-family: "Razor Keen", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 16px;
        background: #000;
        color: var(--text);
      }

      button,
      input,
      select {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #000;
        color: var(--text);
        font: inherit;
      }

      button {
        background: #000;
        color: #fff;
        font-weight: 900;
      }

      button.secondary {
        background: #000;
        color: var(--text);
      }

      .phone-shell {
        display: grid;
        gap: 14px;
        max-width: 520px;
        margin: 0 auto;
      }

      .panel {
        display: grid;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #000;
        box-shadow: none;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 26px;
      }

      h2 {
        font-size: 18px;
      }

      .muted {
        color: var(--muted);
      }

      .stat-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .stat {
        position: relative;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #000;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .stat strong {
        font-size: 22px;
      }

      .phone-damage-badge {
        position: absolute;
        top: -8px;
        right: 8px;
        min-width: 36px;
        padding: 3px 7px;
        border: 1px solid #fff;
        border-radius: 999px;
        background: #000;
        color: #fff;
        font-size: 12px;
        font-weight: 900;
        text-align: center;
      }

      .choice {
        display: grid;
        gap: 8px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 7px;
        background: #000;
      }

      .choice.selected-choice {
        border-color: #fff;
      }

      .active-cast {
        color: var(--gold);
        font-weight: 900;
      }

      .choice.active-cast {
        border-color: #fff;
        background: #090909;
        box-shadow:
          0 0 0 1px #fff,
          0 0 18px rgba(255, 255, 255, 0.22);
      }

      .results {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 14px;
      }

      .warning {
        color: var(--red);
        font-weight: 900;
      }

      .cast {
        color: var(--cyan);
        font-weight: 900;
      }

      body,
      body * {
        color: #fff !important;
        font-family: "Razor Keen", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
        letter-spacing: 0 !important;
      }

      ::placeholder {
        color: #fff !important;
        opacity: 1;
      }

      body {
        font-size: 18px;
      }

      button,
      input,
      select {
        font-size: 18px;
      }

      h1 {
        font-size: 32px;
      }

      h2 {
        font-size: 23px;
      }

      .muted,
      .results {
        font-size: 16px;
        line-height: 1.35;
      }

      .stat span {
        font-size: 14px;
      }

      .stat strong {
        font-size: 26px;
      }

      .phone-damage-badge {
        border-color: #ef6f61 !important;
        box-shadow: 0 0 14px rgba(239, 111, 97, 0.3);
      }

      .choice.selected-choice,
      .choice.active-cast {
        border-color: #e1b84c !important;
        box-shadow: 0 0 16px rgba(225, 184, 76, 0.3);
      }

      .active-cast,
      .cast {
        text-shadow: 0 0 10px rgba(225, 184, 76, 0.35);
      }

      .warning {
        text-shadow: 0 0 10px rgba(239, 111, 97, 0.35);
      }

      .phone-damage-badge,
      .choice.selected-choice,
      .choice.active-cast {
        box-shadow: none !important;
      }

      .active-cast,
      .cast,
      .warning {
        text-shadow: none !important;
      }
      .guess-stat {
        grid-column: 1 / -1;
        text-align: center;
      }

      .guess-stat strong {
        font-size: 34px;
      }

      .cast-banner {
        display: grid;
        gap: 4px;
        padding: 14px;
        border: 2px solid #fff;
        border-radius: 8px;
        text-align: center;
      }

      .cast-banner strong {
        font-size: 24px;
        letter-spacing: 1px;
      }

      .choice-head {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 12px;
      }

      .choice-head > div {
        display: grid;
        gap: 4px;
      }

      .artifact-icon {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }

      .banner-icon {
        width: 72px;
        height: 72px;
        justify-self: center;
      }

      .cast-banner-success,
      .cast-banner-success * {
        color: #7fc47b !important;
      }

      .cast-banner-fail,
      .cast-banner-fail * {
        color: #ef6f61 !important;
      }

      .cast-banner-success {
        border-color: #7fc47b;
        color: #7fc47b;
        background: rgba(127, 196, 123, 0.1);
      }

      .cast-banner-fail {
        border-color: #ef6f61;
        color: #ef6f61;
        background: rgba(239, 111, 97, 0.1);
      }

      .cast-banner-skip {
        border-color: rgba(255, 255, 255, 0.5);
        color: #fff;
      }

      /* header: the face (rerolled with wins), the name, the wins and the Rules link */
      .phone-title-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
      }

      .phone-title {
        display: grid;
        gap: 2px;
        min-width: 0;
      }

      .phone-title h1 {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .phone-face {
        width: 58px;
        height: 58px;
        object-fit: contain;
      }

      .phone-wins {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 18px;
      }

      .wins-mark {
        width: 18px;
        height: 18px;
        color: #dc2a2f;
      }

      .rules-link {
        width: auto;
        min-height: 34px;
        padding: 0 12px;
        border-color: rgba(255, 255, 255, 0.5);
        font-size: 15px;
      }

      .clock-stat {
        grid-column: 1 / -1;
        text-align: center;
      }

      .clock-stat.clock-low strong,
      .clock-stat.clock-low span {
        color: #dc2a2f !important;
      }

      .winner-block {
        display: grid;
        gap: 6px;
        padding: 14px;
        border: 2px solid #fff;
        border-radius: 8px;
        text-align: center;
      }

      .winner-block strong {
        font-size: 26px;
      }

      .winner-block.you-won {
        border-color: #dc2a2f;
      }

      .winner-block.you-won strong {
        color: #dc2a2f !important;
      }

      .reroll-button + .reroll-button {
        margin-top: -4px;
      }

      /* the rules: one stone tablet of commandments */
      .rules-layer {
        display: grid;
        place-items: start center;
        min-height: calc(100vh - 32px);
      }

      .tablet {
        display: grid;
        gap: 14px;
        width: 100%;
        max-width: 520px;
        padding: 46px 20px 20px;
        border: 2px solid #e9e3d6;
        border-radius: 50% 50% 10px 10px / 70px 70px 10px 10px;
        box-shadow: inset 0 0 0 6px #000, inset 0 0 0 7px rgba(233, 227, 214, 0.45);
        text-align: center;
      }

      .tablet h2 {
        font-size: 22px;
      }

      .tablet ol {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
        text-align: left;
      }

      .tablet li {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        gap: 8px;
        font-size: 16px;
        line-height: 1.35;
      }

      .tablet .numeral {
        color: #dc2a2f !important;
        font-size: 18px;
        text-align: right;
      }

      /* ---------- the game's look: hand-drawn frames that tremble (line boil), as on the big screen ----------
         Boxes get the frantic frame (three drawings swapped in steps, out of step with each other),
         buttons and fields the sketched button frame; pressed buttons turn blood red. */
      @keyframes outline-boil {
        0% { border-image-source: url("assets/occult-ui-border-kit/assets/boil/frantic-0.png"); }
        33.333% { border-image-source: url("assets/occult-ui-border-kit/assets/boil/frantic-1.png"); }
        66.666% { border-image-source: url("assets/occult-ui-border-kit/assets/boil/frantic-2.png"); }
      }

      .panel,
      .stat,
      .choice,
      .cast-banner,
      .winner-block {
        position: relative;
        border: 0 !important;
        border-radius: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
      }

      .panel { padding: 22px 20px; }
      .stat { padding: 12px 14px; }
      .choice { padding: 16px 16px 14px; }
      .cast-banner,
      .winner-block { padding: 18px 16px; }

      .panel::after,
      .stat::after,
      .choice::after,
      .cast-banner::after,
      .winner-block::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        box-sizing: border-box;
        border: 22px solid transparent;
        border-image: url("assets/occult-ui-border-kit/assets/border-frantic-sharp.png") 15% / 22px stretch;
        opacity: 0.9;
        animation: outline-boil 375ms steps(1) infinite;
      }

      .stat::after,
      .choice::after {
        border-width: 14px;
        border-image-width: 14px;
        opacity: 0.75;
      }

      .stat:nth-child(3n + 2)::after,
      .choice:nth-child(3n + 2)::after,
      .phone-shell > .panel:nth-child(2n)::after {
        animation-delay: -125ms;
      }

      .stat:nth-child(3n)::after,
      .choice:nth-child(3n)::after,
      .cast-banner::after {
        animation-delay: -250ms;
      }

      .panel > *,
      .stat > *:not(.phone-damage-badge),
      .choice > *,
      .cast-banner > *,
      .winner-block > * {
        position: relative;
        z-index: 1;
      }

      /* the red ones: a failed ARTIFACT, your win */
      .cast-banner-fail::after,
      .winner-block.you-won::after {
        filter: brightness(0) saturate(100%) invert(14%) sepia(87%) saturate(5200%) hue-rotate(353deg) brightness(95%);
        opacity: 1;
      }

      .cast-banner-success::after {
        filter: brightness(0) saturate(100%) invert(72%) sepia(19%) saturate(780%) hue-rotate(68deg) brightness(92%);
        opacity: 1;
      }

      .cast-banner-fail,
      .cast-banner-success {
        background: transparent !important;
      }

      .choice.selected-choice::after,
      .choice.active-cast::after {
        opacity: 1;
        border-width: 18px;
        border-image-width: 18px;
      }

      /* buttons and fields: the sketched button frame */
      button,
      input,
      select {
        border: 10px solid transparent !important;
        border-radius: 0 !important;
        border-image: url("assets/occult-ui-border-kit/assets/button-frame-sharp.png") 60 150 / 10px 20px stretch !important;
        background: transparent !important;
        box-shadow: none !important;
        -webkit-tap-highlight-color: transparent;
      }

      input,
      select {
        background: #000 !important;
        padding: 0 10px;
      }

      button:active:not(:disabled) {
        filter: brightness(0) saturate(100%) invert(14%) sepia(87%) saturate(5200%) hue-rotate(353deg) brightness(95%);
      }

      @media (hover: hover) {
        button:hover:not(:disabled) {
          filter: brightness(0) saturate(100%) invert(14%) sepia(87%) saturate(5200%) hue-rotate(353deg) brightness(95%);
        }
      }

      button:disabled {
        opacity: 0.45;
      }

      .rules-link {
        border-width: 8px !important;
        border-image-width: 8px 16px !important;
      }

      /* the damage bubble keeps its own round outline */
      .phone-damage-badge {
        position: absolute !important;
        z-index: 2 !important;
        background: #000 !important;
      }

      @media (prefers-reduced-motion: reduce) {
        .panel::after,
        .stat::after,
        .choice::after,
        .cast-banner::after,
        .winner-block::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="controller" class="phone-shell"></main>
    <!-- t() and the language files (built by pnpm run build:game); the phone follows the host's language -->
    <script src="controller-i18n.js"></script>
    <script src="controller.js"></script>
  </body>
</html>
